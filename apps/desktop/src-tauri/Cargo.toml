[package]
name = "desktop"
version.workspace = true
description = "XSH cross-platform SSH, SFTP, VNC and RDP client"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono.workspace = true
futures.workspace = true
regex = "1.12"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls"] }
semver = "1.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.6.0"
tokio.workspace = true
tokio-tungstenite = "0.26"
tracing.workspace = true
uuid.workspace = true
xsh-domain = { path = "../../../crates/xsh-domain" }
xsh-security = { path = "../../../crates/xsh-security" }
xsh-sftp = { path = "../../../crates/xsh-sftp" }
xsh-ssh = { path = "../../../crates/xsh-ssh" }
xsh-storage = { path = "../../../crates/xsh-storage" }
xsh-rdp = { path = "../../../crates/xsh-rdp" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
