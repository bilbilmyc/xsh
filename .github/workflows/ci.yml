name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare native RDP tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/check-native-rdp-tools.ps1
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          "C:\Strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Check native RDP tools (macOS)
        if: runner.os == 'macOS'
        run: cmake --version && perl --version

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          echo "::add-matcher::.github/clippy-matcher.json"
          cargo clippy --workspace --all-targets --features xsh-rdp/test-peer -- -D warnings 2>&1 | tee clippy.log
          exit ${PIPESTATUS[0]}

      - name: Summarize lint failures
        if: failure()
        shell: bash
        run: |
          test -f clippy.log || exit 0
          grep -aE "^(error|thread '.+' panicked)" clippy.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

      - name: Test Rust workspace
        run: cargo test --workspace --features xsh-rdp/test-peer

      - name: Check Tauri backend
        run: cargo check -p desktop --features xsh-rdp/test-peer

      - name: Build frontend
        run: pnpm run build

      - name: Test frontend utilities
        run: pnpm test
